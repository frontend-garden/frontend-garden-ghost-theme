version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: Update

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 1
    labels: [dependencies]
    commit-message:
      prefix: Update
